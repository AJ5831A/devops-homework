apiVersion: "v1"
kind: "Pod"
metadata:
  name: "load-generator"
spec:
  containers:
    -
      name: "main"
      image: "busybox:1.37"
      command:
        - "sh"
        - "-c"
        - "while true; do wget -q -O /dev/null http://cpu-demo; done"
      resources:
        requests:
          cpu: "25m"
          memory: "16Mi"
        limits:
          cpu: "200m"
          memory: "64Mi"
  restartPolicy: "Never"
