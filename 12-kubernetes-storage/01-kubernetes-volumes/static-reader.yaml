apiVersion: "v1"
kind: "Pod"
metadata:
  name: "static-reader"
spec:
  containers:
    -
      name: "main"
      image: "busybox:1.37"
      command:
        - "sh"
        - "-c"
        - "sleep 3600"
      volumeMounts:
        -
          name: "data"
          mountPath: "/data"
  restartPolicy: "Never"
  volumes:
    -
      name: "data"
      persistentVolumeClaim:
        claimName: "static-data"
