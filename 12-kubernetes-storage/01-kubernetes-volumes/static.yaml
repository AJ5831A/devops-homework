apiVersion: "v1"
kind: "PersistentVolume"
metadata:
  name: "homework-static"
spec:
  capacity:
    storage: "100Mi"
  accessModes:
    - "ReadWriteOnce"
  persistentVolumeReclaimPolicy: "Retain"
  storageClassName: ""
  hostPath:
    path: "/tmp/homework-static"
    type: "DirectoryOrCreate"
---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "static-data"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "100Mi"
  storageClassName: ""
  volumeName: "homework-static"
