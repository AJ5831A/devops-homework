apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "web-app"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "web-app"
  template:
    metadata:
      labels:
        app: "web-app"
    spec:
      containers:
        -
          name: "web"
          image: "nginx:1.28-alpine"
          ports:
            -
              containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            -
              name: "data"
              mountPath: "/data"
          startupProbe:
            httpGet:
              path: "/"
              port: 80
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: "/"
              port: 80
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: "/"
              port: 80
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        -
          name: "data"
          persistentVolumeClaim:
            claimName: "web-data"
