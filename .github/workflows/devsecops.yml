name: DevSecOps calculator
on:
  push:
    branches: [main]
    paths: ['16-devsecops/**', '.github/workflows/devsecops.yml']
  pull_request:
    paths: ['16-devsecops/**', '.github/workflows/devsecops.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and unit test
        working-directory: 16-devsecops
        run: |
          set -euo pipefail
          python -m compileall -q app
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt
          tar --exclude='__pycache__' -czf application.tar.gz app Dockerfile requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: secure-calculator-build
          path: |
            16-devsecops/application.tar.gz
            16-devsecops/test-results.txt
  security:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and inventory security tools
        run: |
          python -m pip install bandit pip-audit
          python -m pip freeze | tee security-tool-versions.txt
      - name: SAST gate (Bandit)
        run: bandit -r 16-devsecops/app -c 16-devsecops/.bandit.yaml -f json -o sast.json
      - name: SCA gate (installed Python toolchain)
        # Runtime is stdlib-only; audit the actual third-party scanning toolchain.
        run: pip-audit --format json --output sca.json
      - name: Secret scanning gate (working tree)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
          format: json
          output: secrets.json
      - name: Preserve security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-security-reports
          path: |
            security-tool-versions.txt
            sast.json
            sca.json
            secrets.json
  delivery:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute immutable image tag
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/secure-calculator:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Docker build
        run: docker build --pull -t "$IMAGE" 16-devsecops
      - name: Test application inside the built runtime
        run: docker run --rm --read-only -v "$PWD/16-devsecops/tests:/tests:ro" "$IMAGE" python -m unittest discover -s /tests -v
      - name: Container security gate (HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: container-scan.json
      - name: Preserve container report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-report
          path: container-scan.json
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE"
      - name: Create ephemeral Kubernetes cluster
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: helm/kind-action@v1
        with:
          cluster_name: pipeline
      - name: Deploy and verify
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # Pull the published tag before loading it; no registry credentials enter the cluster.
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name pipeline
          kubectl apply -f 16-devsecops/k8s/deployment.yaml
          kubectl set image deployment/secure-calculator calculator="$IMAGE"
          kubectl rollout status deployment/secure-calculator --timeout=180s
          kubectl get pods -o wide | tee deployment-evidence.txt
          kubectl port-forward service/secure-calculator 8080:80 >port-forward.log 2>&1 &
          FORWARD_PID=$!
          trap 'kill "$FORWARD_PID" || true' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/health | tee health.json
          python3 -c 'import json; assert json.load(open("health.json"))["status"] == "ok"'
          curl --fail 'http://127.0.0.1:8080/calculate?op=add&a=2&b=3' | tee calculator.json
          python3 -c 'import json; assert json.load(open("calculator.json"))["result"] == 5'
      - name: Save deployment evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: secure-calculator-deployment
          if-no-files-found: ignore
          path: |
            deployment-evidence.txt
            health.json
            calculator.json
            port-forward.log
