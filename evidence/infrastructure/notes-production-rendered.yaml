---
# Source: notes-chart/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: validation-config
data:
  APP_NAME: "notes-app"
  ENVIRONMENT: "production"
  index.html: |
    <!doctype html>
    <html><head><title>Notes</title></head><body>
    <h1>notes-app</h1>
    <p>Environment: production</p>
    <p>Packaged and deployed with Helm.</p>
    </body></html>
---
# Source: notes-chart/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: validation-svc
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: validation
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30090
---
# Source: notes-chart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: validation
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: validation
      annotations:
        checksum/config: bd83c3c47f4d4241d2051a861185508c11f586e0e24be58d0a655ecbe2a6bae7
    spec:
      containers:
        - name: notes
          image: "nginx:1.28-alpine"
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: validation-config
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: validation-config
            items:
              - key: index.html
                path: index.html
