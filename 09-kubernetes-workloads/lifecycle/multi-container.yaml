apiVersion: "v1"
kind: "Pod"
metadata:
  name: "multi-container"
spec:
  containers:
    -
      name: "main"
      image: "busybox:1.37"
      command:
        - "sh"
        - "-c"
        - "sleep 3600"
    -
      name: "sidecar"
      image: "busybox:1.37"
      command:
        - "sh"
        - "-c"
        - "while true; do echo sidecar; sleep 10; done"
  restartPolicy: "Never"
