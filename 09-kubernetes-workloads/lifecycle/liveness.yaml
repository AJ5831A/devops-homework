apiVersion: "v1"
kind: "Pod"
metadata:
  name: "liveness"
spec:
  containers:
    -
      name: "main"
      image: "busybox:1.37"
      command:
        - "sh"
        - "-c"
        - "sleep 10; touch /tmp/healthy; sleep 3600"
      livenessProbe:
        exec:
          command:
            - "test"
            - "-f"
            - "/tmp/healthy"
        periodSeconds: 2
        failureThreshold: 3
        initialDelaySeconds: 15
  restartPolicy: "Always"
