apiVersion: "v1"
kind: "Pod"
metadata:
  name: "init-demo"
spec:
  containers:
    -
      name: "main"
      image: "busybox:1.37"
      command:
        - "sh"
        - "-c"
        - "sleep 3600"
  restartPolicy: "Never"
  initContainers:
    -
      name: "initialize"
      image: "busybox:1.37"
      command:
        - "sh"
        - "-c"
        - "echo initialization; sleep 10"
