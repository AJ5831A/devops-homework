apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-web
spec:
  replicas: 2
  selector:
    matchLabels: {app: gitops-web}
  template:
    metadata:
      labels: {app: gitops-web}
    spec:
      containers:
        - name: web
          image: nginx:1.28-alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-web
spec:
  selector: {app: gitops-web}
  ports: [{port: 80, targetPort: 80}]
