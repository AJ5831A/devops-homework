apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-calculator
  template:
    metadata:
      labels:
        app: secure-calculator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: calculator
          # Workflow replaces this placeholder with the image it built and scanned.
          image: calculator:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: secure-calculator
spec:
  selector:
    app: secure-calculator
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
