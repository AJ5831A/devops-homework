apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  APP_NAME: {{ .Values.app.name | quote }}
  ENVIRONMENT: {{ .Values.app.environment | quote }}
  index.html: |
    <!doctype html>
    <html><head><title>Notes</title></head><body>
    <h1>{{ .Values.app.name | html }}</h1>
    <p>Environment: {{ .Values.app.environment | html }}</p>
    <p>Packaged and deployed with Helm.</p>
    </body></html>
